identity:
  author: Piconasha
  name: amap
  label:
    en_US: Amap
    zh_Hans: 高德开放平台
  description:
    en_US: Connect to Amap Open Platform for IP geolocation queries and walking route planning.
    zh_Hans: 连接高德开放平台，提供IP归属地查询和步行路线规划功能。
  icon: icon.svg
  tags:
    - travel
    - utilities

credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
      zh_Hans: API Key
    placeholder:
      en_US: Please enter your Amap API key
      zh_Hans: 请输入您的高德 API Key
    help:
      en_US: Get your API key from Amap Open Platform console
      zh_Hans: 从高德开放平台控制台获取您的 API Key
    url: https://console.amap.com/dev/key/app

tools:
  - tools/direction_v2/walking.yaml
  - tools/ip/query.yaml

extra:
  python:
    source: provider/amap.py
