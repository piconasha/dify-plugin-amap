identity:
  name: "direction_v2-walking"
  author: "Piconasha"
  label:
    en_US: "Walking Route Planning V2"
    zh_Hans: "步行路线规划 V2"
description:
  human:
    en_US: "Plan a walking route between two coordinate points."
    zh_Hans: "根据起终点坐标规划步行路线。"
  llm: "Plan a walking route between two coordinate points."
parameters:
  - name: starting_point
    type: string
    form: llm
    required: true
    label:
      en_US: "Starting Point"
      zh_Hans: "起点"
    human_description:
      en_US: "The starting point coordinates (longitude,latitude), e.g., 116.397428,39.90923"
      zh_Hans: "起点坐标（经度,纬度），如：116.397428,39.90923"
    llm_description: "The starting point coordinates in format: longitude,latitude (e.g., 116.397428,39.90923)"
  - name: ending_point
    type: string
    form: llm
    required: true
    label:
      en_US: "Destination"
      zh_Hans: "终点"
    human_description:
      en_US: "The destination coordinates (longitude,latitude), e.g., 116.481028,39.989643"
      zh_Hans: "终点坐标（经度,纬度），如：116.481028,39.989643"
    llm_description: "The destination coordinates in format: longitude,latitude (e.g., 116.481028,39.989643)"
extra:
  python:
    source: tools/direction_v2/walking.py
